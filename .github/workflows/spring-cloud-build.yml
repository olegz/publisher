name: Spring Cloud Build
on:
  push:
    branches: [main]
  workflow_dispatch: 
jobs:
  build:
      runs-on: ubuntu-latest
      steps:
        - name: Dispatch to test-one
          run: |
              curl -H "Accept: application/vnd.github.everest-preview+json" \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              --request POST \
              --data '{"event_type": "spring-cloud-function", "client_payload": { "foo": "bar" }}' https://api.github.com/repos/olegz/test-one/dispatches
          
          
        - name: A event received 2
          
          run: |
            sleep 20s
            echo "Event received1 ${{ github.event_name == 'spring-cloud-function' }}" 
            echo "Event received2 ${{ github.event_type == 'spring-cloud-function' }}" 
            echo "Event received3 ${{ github.event_type == 'spring-cloud-stream' }}" 
            echo "Event received4 ${{ github.event_type == 'spring-cloud-stream' }}" 

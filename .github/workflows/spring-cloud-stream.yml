
name: Spring Cloud Stream
on:
  push:
    branches: [main]
  workflow_dispatch: 
  repository_dispatch:
    types: [spring-cloud-stream]
jobs:
  job1:
    # dispatch:
    #   name: Dispatch
      #env:
        #PACKAGES_TO_UPGRADE: ${{ needs.run_publish.outputs.packages }}
      runs-on: ubuntu-latest
      strategy:  
        matrix:
          repo: ['olegz/test-one']
          #repo: ['olegz/test-one', 'our-company/repository-C']
      timeout-minutes: 5
      steps:
        - name: Dispatch to next
          run: |
              curl -H "Accept: application/vnd.github.everest-preview+json" \
              -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
              --request POST \
              --data '{"event_type": "next", "client_payload": { "foo": "bar" }}' https://api.github.com/repos/${{ matrix.repo }}/dispatches
      

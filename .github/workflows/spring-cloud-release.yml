name: Checkout and build
on:
  workflow_dispatch:
jobs:
  spring-cloud-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-build
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml
  spring-cloud-function:
    needs: spring-cloud-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-function
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml
  spring-cloud-stream:
    needs: spring-cloud-function
    runs-on: ubuntu-latest
    steps:
      - uses: spring-cloud-stream-build@main
  spring-cloud-commons:
    needs: spring-cloud-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-commons
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml

name: Checkout and build
on:
  workflow_dispatch:
    inputs:
      your-name:
        description: 'Your name'     
        required: true
        default: Unknown
      
jobs:
  configure_properties_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v3
     - name: Set matrix data
       id: set-matrix
       run: echo "matrix=$(jq -c . < ./test.json)" >> $GITHUB_OUTPUT

  
  #BUILD
  spring-cloud-build:
    runs-on: ubuntu-latest
    needs: configure_properties_matrix
    strategy:
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-build
      - name: Dump GitHub RELEASE
        run: echo "Spring Boot Version:" ${{ matrix.boot-version}}
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml
  #FUNCTION
  spring-cloud-function:
    needs: spring-cloud-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-function
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml
  #STREAM      
  spring-cloud-stream:
    needs: spring-cloud-function
    uses: olegz/publisher/.github/workflows/spring-cloud-stream-build.yml@main
  #COMMONS
  spring-cloud-commons:
    needs: spring-cloud-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-commons
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml
  #TASK
  spring-cloud-task:
    needs: [spring-cloud-build, spring-cloud-function, spring-cloud-commons]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: olegz/test-one
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml

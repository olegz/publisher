name: Spring Cloud Release V2

on:
  workflow_dispatch:
env: {}
  
jobs:
  configure:
    runs-on: ubuntu-latest
    #outputs:
      #matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v3
     - name: Set matrix data
       id: set-matrix
       run: echo "env=$(jq -c . < ./test.json)" >> $GITHUB_OUTPUT

  print_properties:
    runs-on: ubuntu-latest
    needs: configure
    strategy:
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
     - run: echo "Boot Version:" ${{ matrix.boot-version }}
     - run: echo "Stream Version:" ${{ matrix.stream-version }}
     - run: echo "Cloud Version:" ${{ matrix.cloud-version }}

  #BUILD
  spring-cloud-build:
    runs-on: ubuntu-latest
    needs: print_properties
    steps:
      - uses: actions/checkout@v4
        with:
          repository: spring-cloud/spring-cloud-build
      - name: Dump GitHub RELEASE
        run: echo "Spring Boot Version:" ${{ matrix.boot-version}}
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Maven build of spring-cloud-build
        run: mvn -B package --file pom.xml
 

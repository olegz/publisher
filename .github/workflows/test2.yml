
name: Test ACTION from JSON

on:
  workflow_dispatch:
  
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      cloud_var: ${{ steps.set-matrix.outputs.cloud_var }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v3
     - name: Set matrix data
       id: set-matrix
       run: echo "matrix=$(jq -c . < ./test.json)" >> $GITHUB_OUTPUT

  print_properties:
    runs-on: ubuntu-latest
    needs: configure
    strategy:
      matrix: ${{ fromJson(needs.configure.outputs.cloud_var) }}
    steps:
     - run: echo "Boot Version:" ${{ matrix.boot-version }}
     - run: echo "Stream Version:" ${{ matrix.stream-version }}
     - run: echo "Cloud Version:" ${{ matrix.cloud-version }}
  foo:
    runs-on: ubuntu-latest
    needs: configure
    steps:
     - run: echo "Boot Version:" ${{ matrix.boot-version }}
    

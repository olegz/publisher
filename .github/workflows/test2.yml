


name: Test ACTION from JSON

on:
  workflow_dispatch:
  
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      ENVSETTINGS: ${{ steps.setMyEnv.outputs.MY_OBJECT }}
    steps:
     - id: setMyEnv
       #run: echo "MY_OBJECT=$(jq -c . < ./test.json)" >> $GITHUB_OUTPUT
       run: |
          echo 'MY_OBJECT={ "boot-version": "4.0.0", "cloud-version": 4.5.4" }' >> $GITHUB_OUTPUT
  print:
    needs: [ configure ]
    runs-on: ubuntu-latest
    env: ${{ fromJson(needs.configure.outputs.ENVSETTINGS) }}
    steps:
      - name: Show the value
        run: |
          echo $boot-version
        

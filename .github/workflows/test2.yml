


name: Test ACTION from JSON

on:
  workflow_dispatch:
  
jobs:
  configure:
    runs-on: ubuntu-latest
    #outputs:
      #cloud_var: ${{ steps.set-matrix.outputs.cloud_var }}
    steps:
     - id: setMyEnv
       run: |
          echo 'MY_OBJECT={ "A_SECOND_VAR": "Hello", "A_THIRD_VAR": "Hello again" }' >> $GITHUB_OUTPUT
  print:
    runs-on: ubuntu-latest
    needs: [configure]
    #outputs:
      #cloud_var: ${{ steps.set-matrix.outputs.cloud_var }}
    steps:
     - name: Almost the solution
       env: ${{ fromJson(steps.setMyEnv.outputs.MY_OBJECT) }}
       run: |
          # The value is set from the object, so we
          # should see "Hello" printed here.
          echo $A_SECOND_VAR
        

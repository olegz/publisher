name: Orchestrate
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Orchestrate Cloud Build
    runs-on: ubuntu-latest
    steps:
      - name: Build test-one
        run: |
          echo "Build test-one"
      - uses: convictional/trigger-workflow-and-wait@v1.3.0
        with:
          owner: olegz
          repo: test-one
          github_token: ${{ secrets.WORKFLOW_TOKEN }} 
          workflow_file_name: maven.yml
      - name: Deploy Web App
        run: |
          echo "Deploy Web App"
          sleep 10s

name: Checkout and build
on:
  workflow_dispatch:
jobs:
  s-c-function:
    runs-on: ubuntu-latest
    steps:
      - name: Lint Code
      - run: npm run s-c-function
        sleep 5s
  s-c-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Test Code
      - run: npm s-c-stream
        sleep 5s
              
         

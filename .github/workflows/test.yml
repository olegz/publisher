name: Test ACTION

on:
  workflow_dispatch:
  
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      ENVSET: ${{ steps.set-matrix.outputs.MY_OBJECT }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v4
     - name: Set matrix data
       id: set-matrix
       #run: echo "MY_OBJECT=$(jq -c . < ./test.json)" >> $GITHUB_OUTPUT
       run: |
         echo 'MY_OBJECT={ "BOOT_VERSION": "4.0.0", "CLOUD_VERSION": "4.5.4" }' >> $GITHUB_OUTPUT

  print_properties:
    runs-on: ubuntu-latest
    needs: configure
    env: ${{ fromJson(needs.configure.outputs.ENVSET) }}
    steps:
      - name: Show the value
        run: |
          echo $BOOT_VERSION

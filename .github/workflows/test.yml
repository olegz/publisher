name: Test ACTION

on:
  workflow_dispatch:
  
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
     - name: Checkout to repository
       uses: actions/checkout@v3
     - name: Set matrix data
       id: set-matrix
       run: echo "matrix=$(jq -c . < ./test.json)" >> $GITHUB_OUTPUT

  print_properties:
    runs-on: ubuntu-latest
    needs: configure
    #strategy:
      env: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
     - run: echo "Boot Version:" ${{ matrix.boot-version }}
     - run: echo "Stream Version:" ${{ matrix.stream-version }}
     - run: echo "Cloud Version:" ${{ matrix.cloud-version }}
    
